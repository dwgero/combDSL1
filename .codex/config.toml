sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
domains = { "api.github.com" = "allow", "github.com" = "allow", "release-assets.githubusercontent.com" = "allow", "invisible-island.net" = "allow", "git.git.savannah.gnu.org" = "allow" }
